name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-matrix:
    name: test-matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is opt-in via the test-on-mac PR label.
        os: ${{ fromJSON(contains(github.event.pull_request.labels.*.name, 'test-on-mac') && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install make
        if: runner.os == 'Windows'
        run: choco install make -y

      - name: Test
        run: make test

  # Single stable check name for the branch ruleset: require only "test".
  test:
    name: test
    needs: test-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all matrix jobs to pass
        if: needs.test-matrix.result == 'failure' || needs.test-matrix.result == 'cancelled'
        run: exit 1