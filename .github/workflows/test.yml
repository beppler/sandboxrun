name: Test

on:
  push:
    branches:
      - main
  pull_request:
    # Re-run on label changes so the required "test" check reflects the
    # current test-on-mac state (adding the label re-runs with macOS).
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

permissions:
  contents: read

jobs:
  test-matrix:
    name: test-matrix (${{ matrix.os }})
    # Ignore label events unless test-on-mac was added or removed: on
    # 'labeled' the PR has the label; on 'unlabeled' only the event payload
    # knows the removed label's name, so check github.event.label.name.
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled') || contains(github.event.pull_request.labels.*.name, 'test-on-mac') || github.event.label.name == 'test-on-mac' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is opt-in via the test-on-mac PR label.
        os: ${{ fromJSON(contains(github.event.pull_request.labels.*.name, 'test-on-mac') && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install make
        if: runner.os == 'Windows'
        run: choco install make -y

      - name: Test
        run: make test

  # Single stable check name for the branch ruleset: require only "test".
  test:
    name: test
    needs: test-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all matrix jobs to pass
        if: needs.test-matrix.result == 'failure' || needs.test-matrix.result == 'cancelled'
        run: exit 1